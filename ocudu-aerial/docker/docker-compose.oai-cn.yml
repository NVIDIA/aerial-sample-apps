#
# Use the OAI CN from oai-cn5g/docker-compose.yaml, which is already running
# on oai-cn5g-public-net. This file does not define those NFs.
# 5gc is Open5GS and is built locally; the profile keeps it out of this
# project so `up` does not build it. depends_on is replaced so the gNB is
# not pulled back onto that service.

services:
  5gc:
    profiles:
      - open5gs
  gnb:
    depends_on: !override
      aerial:
        condition: service_started
    environment:
      - GNB_CONFIG_TEMPLATE=/configs/gnb_split6_oai_cn.yaml
    networks:
      oai_cn:
        ipv4_address: 192.168.70.140

networks:
  oai_cn:
    external: true
    name: oai-cn5g-public-net
