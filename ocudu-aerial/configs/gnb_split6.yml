# Single-cell base configuration for gnb_split_6 (split 6 = DU high only, no integrated RU).
# Use with: gnb_split_6 -c gnb_split6.yml, plus a cells overlay for multi-cell setups.

cu_cp:
  amf:
    addrs: ${OPEN5GS_IP}
    port: 38412
    bind_addrs: ${GNB_IP}
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

cell_cfg:
  dl_arfcn: 650000
  band: 78
  channel_bandwidth_MHz: 100
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  nof_antennas_dl: 4
  nof_antennas_ul: 4
  ta:
    ta_cmd_offset_threshold: 3
  prach:
    prach_config_index: 159
    prach_root_sequence_index: 1
    zero_correlation_zone: 14
    preamble_rx_target_pw: -126
  ssb:
    ssb_block_power_dbm: -12
  pdcch:
    dedicated:
      coreset1_l_crb: 96
  pdsch:
    min_rb_size: 1
    max_rb_size: 273
    start_rb: 0
    end_rb: 273
    enable_csi_rs_pdsch_multiplexing: false
    olla_cqi_inc_step: 0.001
    olla_target_bler: 0.1
    max_consecutive_kos: 1000
    max_rank: 4
  pusch:
    min_rb_size: 1
    max_rb_size: 273
    start_rb: 0
    end_rb: 273
    p0_nominal_with_grant: -100
    enable_cl_loop_pw_control: true
    target_sinr: 25.0
    enable_phr_bw_adaptation: true
    enable_transform_precoding: false
    beta_offset_ack_idx_2: 11
    olla_target_bler: 0.1
    min_k2: 2
  pucch:
    p0_nominal: -96
    min_k1: 2
  csi:
    pwr_ctrl_offset: 0
    csi_rs_period: 20
  tdd_ul_dl_cfg:
    dl_ul_tx_period: 4
    nof_dl_slots: 4
    nof_dl_symbols: 0
    nof_ul_slots: 0
    nof_ul_symbols: 0
    pattern2:
      dl_ul_tx_period: 6
      nof_dl_slots: 3
      nof_dl_symbols: 0
      nof_ul_slots: 2
      nof_ul_symbols: 4

log:
  filename: /tmp/gnb.log
  all_level: warning
  mac_level: info

pcap:
  mac_enable: false
  mac_type: dlt
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: true
  ngap_filename: /tmp/gnb_ngap.pcap

metrics:
  autostart_stdout_metrics: true
  enable_json: true

remote_control:
  bind_addr: 0.0.0.0
  enabled: true

expert_execution:
  affinities:
    main_pool_cpus: "${GNB_MAIN_POOL_CPUS:-12-18}"
    main_pool_pinning: ${GNB_MAIN_POOL_PINNING:-mask}
  threads:
    main_pool:
      nof_threads: ${GNB_MAIN_POOL_NOF_THREADS:-4}
      task_queue_size: 4096
